name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt

    - name: Build with PyInstaller
      run: |
        python -m PyInstaller --clean -y Chenkron.spec

    - name: Verify build output
      shell: bash
      run: |
        ls -la dist/
        ls -la dist/Chenkron/

    - name: Compress Build Artifact
      shell: pwsh
      run: |
        Compress-Archive -Path "dist\Chenkron\*" -DestinationPath "dist\Chenkron_Windows_x64.zip" -Force

    - name: Upload Windows EXE Directory
      uses: actions/upload-artifact@v4
      with:
        name: Chenkron_Windows_Folder
        path: dist/Chenkron/
        if-no-files-found: error

    - name: Upload Windows EXE Zip
      uses: actions/upload-artifact@v4
      with:
        name: Chenkron_Windows_ZIP
        path: dist/Chenkron_Windows_x64.zip
        if-no-files-found: error

